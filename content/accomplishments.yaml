#     Put **asterisks** around student authors to show them in bold.
# ---------------------------------------------------------------------------

years:
  - year: "2026"
    fellowships:
      - title: 2026 Phi Kappa Phi Fellowship & Bond Fellowship
        students:
          - Anshuraj Sedai ’26
        result: Fellowship recipient
        detail: >-
          Anshuraj received the 2026 Phi Kappa Phi Fellowship, awarded to members entering their
          first year of graduate or professional study. He also received the Bond Fellowship,
          recognizing the top-scoring nominees in the fields of mathematics or information
          technology.
        links:
          - label: 2026 fellowship recipients
            href: https://www.phikappaphi.org/grants-awards/fellowship/2026-fellowship-recipients
    hackathons:
      - title: Two prizes at Hack@URI 2026
        students:
          - Pranish Uprety
          - Anshuraj Sedai
          - Shovan Raut
          - Rahul Mandal
        result: 1st place, Health Track · Best Use of PreSage (MLH)
        detail: >-
          Out of more than 100 undergraduate, Master’s, and PhD participants at the University of
          Rhode Island’s annual hackathon, the team took first place in the Health Track and also
          won “Best Use of PreSage,” a Major League Hacking sponsor track. Their project, Respondr,
          is an AI-assisted emergency response platform that continuously monitors wearable health
          data — heart rate, respiratory rate, oxygen levels, and activity patterns — detects
          abnormal trends automatically, and instantly connects patients with medical responders
          through live dashboards and video calls.
        links:
          - label: Respondr on Devpost
            href: https://devpost.com/software/respondr-zqegfs
      - title: HackPrinceton 2026 Spring
        students:
          - Pranish Uprety
          - Anshuraj Sedai
          - Binayak Subedi
          - Rahul Mandal
        result: Accepted & participated
        detail: >-
          Accepted to a 36-hour hackathon held at Princeton University, April 17–19, 2026. The team
          built CarboKnot, a Chrome extension that shows users the carbon cost of items before they
          purchase them. Calculations run directly on the device, results are explained with AI, and
          the tool connects to a user’s purchase history for a more personalized experience.
      - title: Hoya Hacks 2026
        students:
          - Pranish Uprety
          - Anshuraj Sedai
          - Binayak Subedi
          - Rahul Mandal
        result: Accepted & participated
        detail: >-
          At Georgetown University’s annual hackathon, the team built CampPulse, a full-stack campus
          crowdsourcing app that merges real-time check-ins, safety reports, and location-based
          insights so students can see what is happening, where it is happening, and how to move
          safely.
        links:
          - label: CampPulse on Devpost
            href: https://devpost.com/software/camppulse

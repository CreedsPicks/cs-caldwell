      - name: Dr. Bella Veksler
        title: Adjunct Lecturer & Director of Institutional Research
        focus: Human-Computer Interaction & Computational Modeling
        bio: |-
          Dr. Veksler serves as the Director of Institutional Research at Caldwell University, where she leverages large-scale institutional data to drive strategic decision-making, assessment, and grant support while ensuring reporting compliance. She is also an Adjunct Instructor in Computer Science, teaching Computational Modeling & Simulation and Programming Languages.

          She brings two decades of experience in computational science and scientific data analysis. Her expertise in Human-Computer Interaction and performance modeling is backed by a research toolkit that includes designing empirical behavioral studies with eye tracking, actigraphy, and EEG. While her earlier work centered on visual and sustained attention, today she applies this analytical lens to higher education, focusing on institutional assessment and the optimization of teaching effectiveness.
        initials: BV
        education:
          - Ph.D. Cognitive Science, Rensselaer Polytechnic Institute
          - M.S. Cognitive Science, Rensselaer Polytechnic Institute
          - B.A. Computer Science and Psychology (Cognitive Science concentration), Cornell University
        email: bveksler@caldwell.edu
        phone: 973-618-3553
        office: Rosary Hall 218

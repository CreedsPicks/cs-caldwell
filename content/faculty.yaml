      - name: Richard Campbell
        title: Adjunct Lecturer
        focus: Former Director at Charles Schwab · Former Sr. Architect at TD Ameritrade
        bio: >-
          Richard Campbell began his teaching career following four decades in software engineering.
          Originally from Michigan, he earned his bachelor’s degree from The University of Michigan
          (Go Blue!). He has worked for startups, university research groups, and spent more than 30
          years at various Wall Street banks, where he was able to transition from programming to
          managing production trading systems to software architecture and governance. When he is not
          hacking around with computers, he enjoys watching classic cinema and reading history.

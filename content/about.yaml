title: About

hero:
  image: /images/hero-about.jpg
  height: medium
  eyebrow: About the Department
  title: Small enough to know you. Rigorous enough to prepare you.
  subtitle: >-
    The Department of Computer Science & Information Systems is Caldwell University's
    fastest-growing program — and one of its most hands-on.

sections:

  - type: statement
    eyebrow: Our Mission
    heading: >-
      We train technologists who can reason rigorously, build reliably, and lead with integrity in
      an industry that moves faster every year.

  # Cards are numbered 01, 02, 03… automatically.
  - type: numbered-cards
    background: grey
    items:
      - title: Rigor Without Gatekeeping
        detail: >-
          Difficult courses, taught by faculty who hold office hours like they mean it. We push
          students hard and refuse to let anyone fall through the cracks.
      - title: Build, Not Just Study
        detail: >-
          Every major writes production-quality code well before senior year — in studio courses,
          research groups, and paid internships.
      - title: A Department, Not a Lecture Hall
        detail: >-
          A 12:1 student-to-faculty ratio means professors know your name, your project, and your
          career goals.

  - type: gallery
    eyebrow: Our Community
    heading: A department where faculty and students actually know each other.

# ---------------------------------------------------------------------------
# Events & News page (URL: /events)
# The "events" list at the bottom of this file is also used by the home page,
# which shows the first four.
# ---------------------------------------------------------------------------

title: Events & News

hero:
  image: /images/photos/student-gathering.webp
  height: medium
  eyebrow: Events & News
  title: What's happening in the department this semester.
  subtitle: >-
    Open houses, hackathon nights, guest speakers, and the wins worth bragging about — all in one
    place.

sections:

  - type: events
    eyebrow: Upcoming Events
    from: events.events

  - type: gallery
    eyebrow: Moments Worth Showing Up For
    heading: Every year ends the same way — with our graduates crossing the stage.
    width: narrow
    photos:
      - src: /images/photos/commencement-portrait.webp
        alt: Two graduates in regalia with a faculty member at commencement
        caption: Commencement
        position: center 35%    # which part of the photo stays visible when cropped
      - src: /images/photos/commencement-trio.webp
        alt: Graduates holding diplomas and flowers beside a faculty member in red regalia
        caption: Celebrating our graduates

  - type: news
    eyebrow: The Buzz
    heading: Recent department news.
    items:
      - tag: Achievement
        title: CS Students Take First Place at Garden State Hackathon
        summary: >-
          A four-student team out-built 38 competing squads with a disaster-response routing tool in 24
          hours.
      - tag: Facilities
        title: Department Opens New Cybersecurity Lab in Aquinas Hall
        summary: >-
          A dedicated red-team/blue-team lab gives students hands-on practice defending live simulated
          networks.
      - tag: Research
        title: Dr. Delacroix Awarded Grant for Low-Resource Language Models
        summary: The research grant will fund two undergraduate research assistants starting next semester.

# ---------------------------------------------------------------------------
# Upcoming events, in the order they should appear. Put "day" in quotes.
# ---------------------------------------------------------------------------
events:
  - month: Oct
    day: "17"
    time: 10:00 AM – 1:00 PM
    title: Computer Science Open House
    location: Aquinas Hall, Room 214
    description: >-
      Tour the department’s labs, meet faculty, and sit in on a live coding demo from the hackathon
      team.
  - month: Oct
    day: "25"
    time: 6:00 PM – Midnight
    title: Caldwell Fall Hackathon Night
    location: Jennings Library, Innovation Lab
    description: >-
      An overnight build night open to all majors, with mentors from local tech employers dropping
      in.
  - month: Nov
    day: "14"
    time: 10:00 AM – 1:00 PM
    title: Computer Science Open House
    location: Aquinas Hall, Room 214
    description: >-
      A second open house session for prospective students and families exploring the CS and CIS
      majors.
  - month: Dec
    day: "03"
    time: 4:30 PM – 6:00 PM
    title: Alumni Careers in Tech Panel
    location: Student Center, Great Room
    description: >-
      Five Caldwell CS alumni return to campus to talk about their first jobs in software, security,
      and data.
